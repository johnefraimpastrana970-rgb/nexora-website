name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site.zip"
      - "site.zip.part-*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Reassemble website archive
        run: |
          if [ -f site.zip.part-v5-01 ] && [ -f site.zip.part-v5-02 ] && [ -f site.zip.part-v5-03 ] && [ -f site.zip.part-v5-04 ] && [ -f site.zip.part-v5-05 ] && [ -f site.zip.part-v5-06 ] && [ -f site.zip.part-v5-07 ] && [ -f site.zip.part-v5-08 ] && [ -f site.zip.part-v5-09 ]; then
            cat site.zip.part-v5-01 site.zip.part-v5-02 site.zip.part-v5-03 site.zip.part-v5-04 site.zip.part-v5-05 site.zip.part-v5-06 site.zip.part-v5-07 site.zip.part-v5-08 site.zip.part-v5-09 > site.zip
          fi
      - name: Unpack website
        run: |
          mkdir site
          unzip -q site.zip -d site
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
